<div class="auth-container card text-center">
    <div class="mb-2">
        <i class="fa-solid fa-book-open-reader" style="font-size: 3rem; color: var(--primary);"></i>
    </div>
    <h2>Welcome Back</h2>
    <p class="text-muted mb-2">Login to manage your study schedule.</p>
    
    <form id="loginForm" style="text-align: left;">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" class="form-control" required placeholder="name@example.com">
        </div>
        <div class="form-group">
            <label style="display: flex; justify-content: space-between;">
                Password
                <a href="#" class="text-primary" onclick="app.showForgotPasswordModal(); return false;" style="font-size: 0.85rem;">Forgot Password?</a>
            </label>
            <input type="password" id="password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">
            <i class="fa-solid fa-right-to-bracket"></i> Login
        </button>
    </form>
    
    <p class="mt-3 text-muted">
        Don't have an account? <a href="#" class="text-primary" onclick="app.navigate('signup'); return false;">Sign up</a>
    </p>
    <div style="margin-top: 15px;">
        <a href="#" class="text-muted" onclick="app.navigate('admin_login'); return false;" style="font-size: 0.8rem;"><i class="fa-solid fa-user-shield"></i> Admin Portal</a>
    </div>
</div>

<!-- Forgot Password Modal Structure -->
<div id="forgotPasswordModal" class="modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5);">
    <div class="modal-content card" style="margin: 10% auto; padding: 20px; width: 90%; max-width: 400px; position: relative;">
        <span class="close" onclick="app.closeForgotPasswordModal()" style="position: absolute; right: 20px; top: 15px; font-size: 24px; cursor: pointer;">&times;</span>
        
        <!-- Step 1: Request OTP -->
        <div id="forgotPasswordStep1">
            <h3 style="margin-top: 0;">Reset Password</h3>
            <p class="text-muted mb-2">Enter your email to receive a verification code.</p>
            <form id="forgotPasswordFormStep1" style="text-align: left;" onsubmit="app.handleForgotPasswordRequest(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="forgotEmail" class="form-control" required placeholder="name@example.com">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;" id="btnRequestOtp">
                    Send Verification Code
                </button>
            </form>
        </div>

        <!-- Step 2: Enter OTP & New Password -->
        <div id="forgotPasswordStep2" style="display: none;">
            <h3 style="margin-top: 0;">Enter Code</h3>
            <p class="text-muted mb-2">We've sent a 6-digit code to your email.</p>
            <form id="forgotPasswordFormStep2" style="text-align: left;" onsubmit="app.handleForgotPasswordReset(event)">
                <div class="form-group">
                    <label>Verification Code</label>
                    <input type="text" id="forgotOtp" class="form-control" required placeholder="123456" pattern="[0-9]{6}" maxlength="6">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="forgotNewPassword" class="form-control" required placeholder="••••••••" minlength="6">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;" id="btnResetPassword">
                    Reset Password
                </button>
            </form>
        </div>
    </div>
</div>
