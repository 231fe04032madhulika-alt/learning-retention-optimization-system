<div class="auth-container card">
    <div class="text-center mb-2">
        <i class="fa-solid fa-user-plus" style="font-size: 2.5rem; color: var(--accent);"></i>
        <h2 class="mt-2 text-main">Create Account</h2>
        <p class="text-muted">Start organizing your study life today.</p>
    </div>
    
    <form id="signupForm">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" class="form-control" required placeholder="John Doe">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" class="form-control" required placeholder="john@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" class="form-control" required placeholder="••••••••">
        </div>
        <div style="display: flex; gap: 1rem;">
            <div class="form-group" style="flex: 1;">
                <label>Study Start Time</label>
                <input type="time" id="studyStart" class="form-control" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Study End Time</label>
                <input type="time" id="studyEnd" class="form-control" required>
            </div>
        </div>
        <div style="display: flex; gap: 1rem;">
            <div class="form-group" style="flex: 1;">
                <label>Semester Start Date</label>
                <input type="date" id="semesterStartDate" class="form-control" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Semester End Date</label>
                <input type="date" id="semesterEndDate" class="form-control" required>
            </div>
        </div>



        <button type="submit" class="btn btn-primary mt-2" style="width: 100%;">
            <i class="fa-solid fa-user-check"></i> Sign Up & Start
        </button>
    </form>
    
    <p class="mt-3 text-center text-muted">
        Already have an account? <a href="#" class="text-primary" onclick="app.navigate('login'); return false;">Log in</a>
    </p>
</div>
