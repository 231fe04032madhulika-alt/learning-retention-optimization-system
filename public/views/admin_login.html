<div class="auth-container card text-center">
    <div class="mb-2">
        <i class="fa-solid fa-user-shield" style="font-size: 3rem; color: #374151;"></i>
    </div>
    <h2>Admin Portal</h2>
    <p class="text-muted mb-2">Secure access for platform administrators.</p>
    
    <form id="adminLoginForm" style="text-align: left;">
        <div class="form-group">
            <label>Admin Email</label>
            <input type="email" id="adminEmail" class="form-control" required placeholder="admin@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="adminPassword" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; background-color: #374151; border-color: #374151;">
            <i class="fa-solid fa-user-shield"></i> Admin Login
        </button>
    </form>
    
    <p class="mt-3 text-muted" style="margin-top: 15px;">
        <a href="#" class="text-primary" onclick="app.navigate('login'); return false;"><i class="fa-solid fa-arrow-left"></i> Back to Student Login</a>
    </p>
</div>
