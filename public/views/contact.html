<div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
    <h2 style="color: var(--primary-color); margin-bottom: 20px; text-align: center;">Get In Touch</h2>
    <div class="card">
        <p class="text-muted mb-4" style="text-align: center;">Have a question about the project or want to report a bug? Send us a message.</p>
        <form onsubmit="event.preventDefault(); app.showToast('Message sent successfully!'); this.reset();">
            <div class="form-group mb-3">
                <label>Name</label>
                <input type="text" class="form-control" placeholder="Your Name" required>
            </div>
            <div class="form-group mb-3">
                <label>Email</label>
                <input type="email" class="form-control" placeholder="your.email@example.com" required>
            </div>
            <div class="form-group mb-3">
                <label>Subject</label>
                <input type="text" class="form-control" placeholder="Brief subject" required>
            </div>
            <div class="form-group mb-4">
                <label>Message</label>
                <textarea class="form-control" rows="5" placeholder="Write your message here..." required style="width: 100%; border: 1px solid #ccc; border-radius: 5px; padding: 10px;"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
        </form>
    </div>
</div>
