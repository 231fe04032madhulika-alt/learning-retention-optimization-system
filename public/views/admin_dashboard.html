<div class="card mt-4">
    <h2 class="text-primary"><i class="fa-solid fa-user-shield"></i> Administration Panel</h2>
    <p class="text-muted mb-4">View real-time system metrics and platform health. Click on a card to manage data.</p>

    <div id="admin-stats-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
        <div class="loader-container" style="grid-column: 1 / -1;"><div class="spinner"></div></div>
    </div>
</div>

<div class="card mt-4">
    <h3><i class="fa-solid fa-users"></i> Registered Users</h3>
    <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; margin-top: 15px; text-align: left;">
            <thead>
                <tr style="border-bottom: 2px solid #e5e7eb;">
                    <th style="padding: 12px; color: #4b5563;">Name</th>
                    <th style="padding: 12px; color: #4b5563;">Email</th>
                    <th style="padding: 12px; color: #4b5563;">Join Date</th>
                    <th style="padding: 12px; color: #4b5563;">Semester Schedule</th>
                    <th style="padding: 12px; color: #4b5563;">Actions</th>
                </tr>
            </thead>
            <tbody id="admin-users-table">
            </tbody>
        </table>
    </div>
</div>

<!-- Reusable Admin Modal -->
<div id="admin-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div class="card" style="width: 90%; max-width: 800px; max-height: 80vh; overflow-y: auto; position: relative;">
        <button onclick="document.getElementById('admin-modal').style.display='none'" style="position: absolute; right: 20px; top: 20px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #6b7280;">&times;</button>
        <h3 id="admin-modal-title" style="margin-top: 0;">Data View</h3>
        <div id="admin-modal-content" style="margin-top: 20px;">
            <div class="loader-container"><div class="spinner"></div></div>
        </div>
    </div>
</div>
